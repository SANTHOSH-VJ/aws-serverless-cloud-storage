AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: personal-cloud-backend

Globals:
  Function:
    Timeout: 10
    Runtime: python3.13
    Architectures:
      - x86_64
    Environment:
      Variables:
        BUCKET_NAME: personal-cloud-storage-clouddrive
  Api:
    Cors:
      AllowMethods: "'GET,POST,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'*'"
    Auth:
      AddDefaultAuthorizerToCorsPreflight: false
      DefaultAuthorizer: CognitoAuthorizer
      Authorizers:
        CognitoAuthorizer:
          UserPoolArn: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/us-east-1_AwLrx4j9e"

Resources:

  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello_world/
      Handler: app.upload_handler
      Policies:
        - S3CrudPolicy:
            BucketName: personal-cloud-storage-clouddrive
      Events:
        UploadApi:
          Type: Api
          Properties:
            Path: /upload
            Method: post

  ListFilesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello_world/
      Handler: app.list_files_handler
      Policies:
        - S3CrudPolicy:
            BucketName: personal-cloud-storage-clouddrive
      Events:
        ListFilesApi:
          Type: Api
          Properties:
            Path: /list
            Method: get

  DownloadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello_world/
      Handler: app.download_handler
      Policies:
        - S3CrudPolicy:
            BucketName: personal-cloud-storage-clouddrive
      Events:
        DownloadApi:
          Type: Api
          Properties:
            Path: /download
            Method: get

  DeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello_world/
      Handler: app.delete_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:DeleteObject
              Resource: !Sub "arn:aws:s3:::personal-cloud-storage-clouddrive/*"
      Events:
        DeleteApi:
          Type: Api
          Properties:
            Path: /delete
            Method: delete

Outputs:
  ApiBaseUrl:
    Description: API Gateway base URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod"